<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration - Task 3</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f5f9;color:#263238;margin:0;padding:30px 14px}
.container{max-width:780px;margin:auto;background:#fff;padding:26px;border-radius:12px;box-shadow:0 4px 18px #00000012}
h1{text-align:center;color:#244a73;margin:0 0 22px}
table{width:100%;border-collapse:collapse}
td{padding:10px;border:1px solid #dce3eb}
td:first-child{width:31%;font-weight:bold;background:#f8fafc}
input:not([type=radio]):not([type=checkbox]),select,textarea{width:100%;padding:9px;border:1px solid #bdc7d1;border-radius:5px;font:inherit}
input[type=radio],input[type=checkbox]{margin-right:6px}
.choice label{display:inline-block;margin:4px 12px 4px 0;font-weight:normal}
textarea{resize:vertical}
.terms{text-align:center;margin:18px 0}
a{color:#245b8f}
.buttons{text-align:center}
button{padding:10px 25px;margin:0 6px;border:0;border-radius:5px;cursor:pointer;font-size:15px}
.submit{background:#245b8f;color:white}
.reset{background:#e3e8ee;color:#263238}
@media(max-width:560px){.container{padding:14px}td{display:block;width:100%}td:first-child{width:100%;border-bottom:0;padding-bottom:3px}td+td{border-top:0}}
</style>
</head>
<body>
<div class="container">
<h1>Registration</h1>
<form action="Thankyou_task3.html" method="get">
<input type="hidden" name="user_id" value="1001">
<table>
<tr><td><label for="first">First Name</label></td><td><input id="first" name="first_name" type="text" pattern="[A-Za-z]+" title="Letters only" required></td></tr>
<tr><td><label for="last">Last Name</label></td><td><input id="last" name="last_name" type="text" pattern="[A-Za-z]+" title="Letters only" required></td></tr>
<tr><td><label for="email">Email</label></td><td><input id="email" name="email" type="email" required></td></tr>
<tr><td><label for="password">Password</label></td><td><input id="password" name="password" type="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, with uppercase, lowercase, number and special character" required></td></tr>
<tr><td><label for="repeat">Repeat Password</label></td><td><input id="repeat" name="repeat_password" type="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, with uppercase, lowercase, number and special character" required></td></tr>
<tr><td><label for="picture">User Picture</label></td><td><input id="picture" name="user_picture" type="file" accept="image/*"></td></tr>
<tr><td>Gender</td><td class="choice"><label><input type="radio" name="gender" value="Male" required>Male</label><label><input type="radio" name="gender" value="Female">Female</label></td></tr>
<tr><td><label for="faculty">Faculty</label></td><td><select id="faculty" name="faculty" required><option value="">-- Select Faculty --</option><option>Computers and Information</option><option>Engineering</option><option>Science</option><option>Commerce</option><option>Medicine</option><option>Arts</option><option>Other</option></select></td></tr>
<tr><td>Interests</td><td class="choice"><label><input type="checkbox" name="interests" value="Swimming">Swimming</label><label><input type="checkbox" name="interests" value="Reading">Reading</label><label><input type="checkbox" name="interests" value="Programming">Programming</label><label><input type="checkbox" name="interests" value="Traveling">Traveling</label></td></tr>
<tr><td><label for="about">About You</label></td><td><textarea id="about" name="about" rows="4"></textarea></td></tr>
<tr><td><label for="phone">Phone Number</label></td><td><input id="phone" name="phone" type="tel" pattern="01[0125][0-9]{8}" title="Enter 11 digits starting with 010, 011, 012 or 015" required></td></tr>
<tr><td><label for="gpa">GPA</label></td><td><input id="gpa" name="gpa" type="number" min="0" max="4" step="0.1" required></td></tr>
<tr><td><label for="dob">Date of Birth</label></td><td><input id="dob" name="date_of_birth" type="date"></td></tr>
</table>
<div class="terms"><label><input type="checkbox" name="terms" required> I agreed to the <a href="terms_task3.html" target="_blank" rel="noopener">terms and conditions</a></label></div>
<div class="buttons"><button class="submit" type="submit">Submit</button><button class="reset" type="reset">Reset</button></div>
</form>
</div>
</body>
</html>
