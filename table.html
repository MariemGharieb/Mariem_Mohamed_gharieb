<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 2 - Table</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td colspan="2">name</td>
            <td rowspan="2">Address</td>
        </tr>
        <tr>
            <td>First</td>
            <td>Last</td>
        </tr>
        <tr>
            <td colspan="3" style="background-color: green; color: white;">All the data is here</td>
        </tr>
        <tr>
            <td rowspan="2">Hamada</td>
            <td colspan="2">cairo</td>
        </tr>
        <tr>
            <td colspan="2">At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis</td>
        </tr>
    </table>

</body>
</html>
